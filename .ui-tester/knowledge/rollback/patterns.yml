# Verified in round: r13
# Status: verified (ALL BUGS FIXED - BUG-1/2/3/4 confirmed passing)

rollback_message_only_flow:
  description: "Roll back messages only - no code changes"
  steps:
    - action: click
      selector: "button[title='回滚消息']"
      description: "Click '回滚消息' on target user message card"
      note: "Each user message card has this button in the hover-revealed action bar"
    - action: wait
      ms: 2000
    - action: verify
      description: "Rollback overlay appears with title '回滚确认'"
    - action: verify
      description: "Overlay shows '回滚将移除当前轮次的消息，确定继续吗？'"
    - action: click
      selector: "button:has-text('确认回滚')"
      description: "Confirm the rollback"
    - action: wait
      ms: 3000
  expected_result: "Messages from that turn onward are removed. Input box restores the rolled-back user message text."

rollback_with_code_flow:
  description: "Roll back messages AND code changes - shows file overlay"
  steps:
    - action: click
      selector: "button[title='回滚消息+代码']"
      description: "Click '回滚消息+代码' on target user message card"
      note: "Each user message card has this button"
    - action: wait
      ms: 2000
    - action: verify
      description: "Rollback overlay appears with title '回滚消息 + 代码'"
    - action: verify
      description: "Overlay shows file count 'N 个文件' and file list with status (A/M/D)"
    - action: optional_click
      description: "Click on file entry to expand diff (shows change details)"
    - action: click
      selector: "button:has-text('确认回滚')"
      description: "Confirm the rollback (or click Cancel to preserve)"
    - action: wait
      ms: 3000
  expected_result: "Messages and file changes from that turn onward are reverted"

cancel_rollback_flow:
  description: "Cancel rollback overlay - preserves all messages"
  steps:
    - action: click
      selector: "button[title='回滚消息+代码']"
      description: "Open rollback overlay"
    - action: click
      selector: "button[title='取消']"
      description: "Click X cancel button in overlay header"
      note: "Can also use button:has-text('取消') at bottom"
    - action: wait
      ms: 1000
  expected_result: "Overlay dismissed, all messages preserved"

auth_flow:
  description: "Authenticate with token"
  steps:
    - action: verify
      description: "Auth page shows with pre-filled demo-test-token"
    - action: click
      selector: "button:has-text('连接')"
      description: "Click Connect button"
    - action: wait
      ms: 5000
  expected_result: "Main chat UI loads with sidebar and session list"

send_message_flow:
  description: "Send a chat message using eval click for reliability"
  steps:
    - action: fill
      selector: "[data-testid='chat-input']"
      description: "Type message in chat input"
    - action: eval
      script: "document.querySelector('button[title=\"发送\"]').click()"
      description: "Click send button via eval (more reliable than @ref)"
    - action: wait
      ms: 15000
  expected_result: "User message appears, assistant responds"

