# === CASE 5.4 TEST 2026-05-25 (Rollback Ineffective Detection) ===
# RESULT: GUARD WORKS, NO USER-VISIBLE NOTIFICATION
#
# TEST METHOD:
#   - New session, sent "Say exactly: ONLY" (1 turn, 2 cards)
#   - Tried rollback on first message → SILENT BLOCK (no overlay, no toast)
#   - Sent "Say exactly: SECOND" → 4 cards
#   - Successfully rolled back SECOND → 2 cards
#   - Tried rollback on first message again → SILENT BLOCK (same behavior)
#
# KEY FINDINGS:
#   - First message rollback guard: WORKING (silently blocks)
#   - NO toast/notification/alert shown when rollback is blocked
#   - NO "afterCount >= beforeCount" check observed
#   - Guard uses pre-rollback check: findTurnBoundary returns null for first message
#   - Console shows WARN messages but nothing user-visible
#
# CONSOLE LOG PATTERN (first message rollback attempt):
#   [INFO] rollback requested {sessionId, mode: "message"}
#   [WARN] resolveRollbackTarget: findTurnBoundary returned null (first message?) {entryId}
#   [WARN] rollback aborted: resolveRollbackTarget returned null {sessionId, mode, messageId, hasEntryId, messagesCount}
#
# CONSOLE LOG PATTERN (successful rollback):
#   [INFO] rollback requested {sessionId, mode: "message"}
#   [INFO] resolveRollbackTarget: success {entryId, targetId}
#   [INFO] opening rollback overlay {sessionId, mode, targetId, fileCount}
#
# IMPORTANT: eval .click() does NOT trigger React onClick for rollback buttons
#   - Must use Playwright click via @ref for rollback buttons to work
#   - Eval click triggers server-side handler but overlay doesn't appear
#   - This is because the overlay is a React state change triggered by onClick handler
